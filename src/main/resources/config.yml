database:
  # Can be H2, SQLite, MySQL, MariaDB, PostgreSQL
  # Not case-sensitive
  driver: H2

  # Only useful for remote databases (MySQL, MariaDB, PostgreSQL, etc..)
  remote:
    hostname: localhost
    port: 3306
    database: playertracer
    username: root
    password: ""

  # How many threads can be used to store and retrieve data from the database3
  # If you don't know what this does, don't touch it :)
  # Default: 4
  thread-limit: 4